version: '3.1'

services:
  mysql:
    image: mariadb:latest
    restart: always
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mariadb_data:/var/lib/mysql
    command: >
      sh -c "
      echo 'CREATE DATABASE IF NOT EXISTS luckperms;' > /docker-entrypoint-initdb.d/init.sql &&
      echo 'CREATE DATABASE IF NOT EXISTS mysqlnicks;' >> /docker-entrypoint-initdb.d/init.sql &&
      docker-entrypoint.sh mariadbd
      "
    networks:
      - internal_network

  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: yourpassword
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - internal_network

  server:
    image: ggservers/java21
    volumes:
      - ./srv:/srv
    working_dir: /srv
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: yourpassword
    command: >
      java -Xms128M -Xmx4028M -javaagent:slimeworldmanager-classmodifier-2.2.1.jar
      -XX:MaxRAMPercentage=95.0 -Dterminal.jline=false -Dterminal.ansi=true -jar server.jar
    ports:
      - "10062:10062"
    networks:
      - internal_network

volumes:
  mariadb_data:
  mongo_data:

networks:
  internal_network:
    driver: bridge

secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
